services:
  nclaw:
    image: ghcr.io/avlebedinsky/nclaw:${NCLAW_IMAGE_TAG:-claude}
    container_name: nclaw
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: .env
    environment:
      NCLAW_DATA_DIR: /app/data
      NCLAW_TIMEZONE: ${NCLAW_TIMEZONE:-Europe/Moscow}
      TZ: ${NCLAW_TIMEZONE:-Europe/Moscow}
      # NCLAW_WEBHOOK_BASE_DOMAIN: example.com
      # NCLAW_WEBHOOK_PORT: :3000
    volumes:
      - ./data:/app/data
      - ${CLAUDE_HOME_PATH:-./claude}:/root/.claude
      - ${AGENTS_PATH:-./agents}:/root/.agents
      - ${COPILOT_CONFIG_PATH:-./copilot}:/root/.copilot
    # ports:
    #   - "3000:3000"  # Uncomment if using webhooks
